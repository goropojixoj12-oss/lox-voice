<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Listing moderation policy</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
    </style>
  </head>
  <body>
    <h1>Listing moderation & publication</h1>
    <ul>
      <li>New submissions enter <strong>pending</strong> until admin approval.</li>
      <li>At least one photo is required; media is served via private storage.</li>
      <li>Rejected listings may be re-edited and resubmitted by the agent.</li>
    </ul>
  </body>
