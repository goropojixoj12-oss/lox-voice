name: Validate package-lock

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lockfile-and-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Reject stub or path-placeholder lockfiles
        run: node scripts/validate-package-lock.mjs

      - name: npm ci (lock must match package.json)
        run: npm ci

      - name: Production build
        run: npm run build
        env:
          AUTH_SECRET: ci-placeholder-secret-min-32-chars-long
